name: CI

on:
  push:
  workflow_dispatch:

# Read-only: this workflow never needs to write to the repo, and it gets no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs; the comment shows the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Installs exactly what package-lock.json lists; .npmrc blocks install scripts.
      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Builds the Chrome and Firefox zips and fails if any referenced file is missing.
      - name: Package and verify zips
        run: ./package.sh
